name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  DATABASE_URL: postgres://postgres:postgres@localhost:5432/firefly_notes
  TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/firefly_notes_test
  AI_PROVIDER: fake
  NEXT_TELEMETRY_DISABLED: 1

jobs:
  checks:
    name: Lint, typecheck, test, e2e
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: firefly_notes
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm lint

      - run: pnpm typecheck

      - run: pnpm test

      - run: pnpm db:migrate

      - run: pnpm build

      - run: pnpm exec playwright install --with-deps chromium

      - run: pnpm test:e2e

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  docker:
    name: Docker image builds and boots
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: firefly_notes
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: firefly-notes:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Boot the image against the Postgres service: migrations must run on
      # start, PORT must be honoured, and the health route must answer 200.
      - name: Run the image and check health
        run: |
          docker run --detach --name firefly-notes --network host \
            --env PORT=3456 \
            --env AI_PROVIDER=fake \
            --env DATABASE_URL=postgres://postgres:postgres@localhost:5432/firefly_notes \
            firefly-notes:ci
          for attempt in $(seq 1 30); do
            if curl --silent --fail http://localhost:3456/api/health; then
              echo
              exit 0
            fi
            sleep 1
          done
          echo "Health route did not return 200 within 30s"
          exit 1

      - name: Container logs
        if: always()
        run: docker logs firefly-notes || true
