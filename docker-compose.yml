services:
  db:
    image: postgres:17-alpine
    container_name: firefly-notes-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: firefly_notes
    ports:
      - "5433:5432"
    volumes:
      - firefly-notes-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d firefly_notes"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  firefly-notes-pgdata:
